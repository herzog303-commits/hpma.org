name: Publish marina nowcast

# Regenerates amenities/nowcast.json (the board's 1h + 1-4h rain projection).
# Mostly keyless: nowcast.py calls the free Open-Meteo API + keyless METAR, and
# reads the committed calibration in amenities/nowcast/microclimate.json.
# OPTIONAL: set a repo secret SYNOPTIC_TOKEN to also check the closest rain gauge
# (G2160 Grapeview). Absent -> that check is skipped and METAR still runs.
# OPTIONAL: set repo secrets GMAIL_USER + GMAIL_APP_PASSWORD to email a surge+high-tide
# alert (surge_alert.py) to ALERT_TO. Absent -> the alert step dry-runs (no email).
#
# NOTE: GitHub's scheduled runs are best-effort and can be delayed or skipped
# under load, and are auto-disabled after 60 days of repo inactivity. Good enough
# for a marina board; use the "Run workflow" button for an on-demand refresh.

on:
  schedule:
    - cron: "*/30 * * * *"    # every ~30 min (best-effort)
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a TEST surge-alert email (verify Gmail setup)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: marina-nowcast
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate nowcast.json
        env:
          NOWCAST_OUT: amenities/nowcast.json
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: python amenities/nowcast/nowcast.py
      - name: Generate surge_forecast.json
        continue-on-error: true          # forecast is optional; alert falls back to persistence
        env:
          SURGE_FORECAST_OUT: amenities/surge_forecast.json
        run: python amenities/nowcast/surge_forecast.py
      - name: Surge + high tide alert (email)
        continue-on-error: true          # never let an alert bug block the nowcast publish
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: hpmatech@gmail.com
          ALERT_TEST: ${{ inputs.send_test }}
        run: python amenities/nowcast/surge_alert.py
      - name: Score forecasts vs observed
        continue-on-error: true
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
          NOWCAST_FILE: amenities/nowcast.json
          SURGE_FORECAST_FILE: amenities/surge_forecast.json
          SCORECARD_OUT: amenities/scorecard.json
        run: python amenities/nowcast/score.py
      - name: Commit & push if changed
        run: |
          git config user.name "hpma-nowcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amenities/nowcast.json
          git add amenities/surge_forecast.json 2>/dev/null || true
          git add amenities/nowcast/surge_alert_state.json 2>/dev/null || true
          git add amenities/scorecard.json amenities/nowcast/forecast_log.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change; nothing to commit."
          else
            git commit -m "nowcast: refresh [skip ci]"
            git push
          fi
